<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <base href="/" />
    <!-- 老 WebView 兼容兜底（Chrome < 92 / Android 5.x~8.x）：
         必须内联在 <head>，早于任何模块脚本执行，连模块顶层的 .at() 也能保护。 -->
    <script>
      (function () {
        function defineAt(proto) {
          if (proto.at) return
          Object.defineProperty(proto, 'at', {
            configurable: true,
            writable: true,
            value: function (index) {
              var n = Number(index) || 0
              var len = this.length
              var i = n < 0 ? len + n : n
              return i < 0 || i >= len ? undefined : this[i]
            },
          })
        }
        defineAt(Array.prototype)
        defineAt(String.prototype)
        if (!Object.hasOwn) {
          Object.defineProperty(Object, 'hasOwn', {
            configurable: true,
            value: function (obj, key) {
              return Object.prototype.hasOwnProperty.call(obj, key)
            },
          })
        }
        if (!Array.prototype.flatMap) {
          Object.defineProperty(Array.prototype, 'flatMap', {
            configurable: true,
            writable: true,
            value: function (fn, thisArg) {
              var out = []
              for (var i = 0; i < this.length; i++) {
                if (i in this) {
                  var mapped = fn.call(thisArg, this[i], i, this)
                  if (Array.isArray(mapped)) {
                    for (var j = 0; j < mapped.length; j++) out.push(mapped[j])
                  } else {
                    out.push(mapped)
                  }
                }
              }
              return out
            },
          })
        }
        if (!String.prototype.replaceAll) {
          Object.defineProperty(String.prototype, 'replaceAll', {
            configurable: true,
            writable: true,
            value: function (search, replacement) {
              if (search instanceof RegExp) {
                if (!search.global) {
                  throw new TypeError('replaceAll requires a global RegExp')
                }
                return this.replace(search, replacement)
              }
              var s = String(search)
              if (s === '') {
                var out = ''
                for (var k = 0; k <= this.length; k++) out += replacement + this.charAt(k)
                return out.slice(0, -String(replacement).length)
              }
              return this.split(s).join(replacement)
            },
          })
        }
        // 项目里 clone 的都是纯数据对象（消息/会话），JSON 往返足够
        if (typeof structuredClone === 'undefined') {
          window.structuredClone = function (value) {
            return value === undefined ? undefined : JSON.parse(JSON.stringify(value))
          }
        }
      })()
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>DSchat</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
